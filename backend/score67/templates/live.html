<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live · Score67</title>
{% include "_og.html" %}<link rel="stylesheet" href="/static/display.css"><link rel="stylesheet" href="/static/live.css"></head>
<body class="live-page">
<header><a class="brand" href="/">SCORE<span>67</span></a><button id="language" aria-label="Deutsch / English">DE / EN</button></header>
<main><nav><a href="/" data-i18n="back">Zurück</a><a id="dashboard-link" href="/dashboard" data-i18n="dashboard">Meine Scoreboards</a></nav>
<p class="eyebrow" data-i18n="live.public">Ohne Anmeldung</p><h1 data-i18n="live.title">Aktuelle Liveticker</h1>
<p class="intro" id="intro"></p>
<div class="live-tabs" role="tablist"><button id="tab-live" role="tab" aria-selected="true"></button><button id="tab-upcoming" role="tab" aria-selected="false"></button></div>
<p id="status" role="status" aria-live="polite"></p><p id="empty" data-i18n="live.empty" hidden>Aktuell laufen keine Spiele.</p><p id="empty-upcoming" data-i18n="live.upcoming_empty" hidden></p>
<div id="games" class="live-grid"></div><section id="finished-section" class="live-finished" hidden><h2 data-i18n="live.finished_title">Gerade beendet</h2><div id="finished" class="live-grid"></div></section><div id="upcoming" class="live-grid" hidden></div>
<noscript>Bitte JavaScript aktivieren, um die aktuellen Liveticker anzuzeigen.</noscript></main>
<footer class="version-footer" data-version="{{ release_version }}" data-built="{{ release_built_at }}">{{ release_label }}</footer>
<script type="module" src="/static/live.mjs"></script></body></html>
