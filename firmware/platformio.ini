; Score67 LED panel firmware: Adafruit Matrix Portal S3 + 64×32 HUB75 panel.
; Concept and protocol: ../docs/DISPLAY-FIRMWARE.md
[env]
build_flags = -DFW_VERSION=\"0.2.4\"
lib_deps = bblanchon/ArduinoJson@^7

[env:matrixportal_s3]
platform = espressif32
board = adafruit_matrixportal_esp32s3
framework = arduino
monitor_speed = 115200
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1
  -DSCORE67_HOST=\"score67.de\" -DSCORE67_PORT=443 -DSCORE67_TLS=1
build_src_filter = +<*> -<host_render.cpp>
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit GFX Library
  adafruit/Adafruit Protomatter
  links2004/WebSockets@^2.4

; Development: the panel talks to the server on this laptop (no TLS).
; Start it with: COOKIE_SECURE=false uv run uvicorn score67.app:app --host 0.0.0.0 --port 8067
[env:matrixportal_s3_dev]
extends = env:matrixportal_s3
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1
  -DSCORE67_HOST=\"${sysenv.SCORE67_DEV_HOST}\" -DSCORE67_PORT=8067 -DSCORE67_TLS=0

; Host build of the renderer for tools/compare.mjs (no Arduino).
[env:native]
platform = native
build_flags = ${env.build_flags} -std=c++17
build_src_filter = +<feed.cpp> +<render.cpp> +<host_render.cpp>
