; Score67 LED panel firmware: Adafruit Matrix Portal S3 + 64×32 HUB75 panel.
; Concept and protocol: ../docs/DISPLAY-FIRMWARE.md
[env]
platform = espressif32
board = adafruit_matrixportal_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
  -DFW_VERSION=\"0.1.0\"
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:matrixportal_s3]
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit Protomatter
