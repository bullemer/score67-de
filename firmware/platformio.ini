; Score67 LED panel firmware: Adafruit Matrix Portal S3 + 64×32 HUB75 panel.
; Concept and protocol: ../docs/DISPLAY-FIRMWARE.md
[env]
build_flags = -DFW_VERSION=\"0.1.0\"
lib_deps = bblanchon/ArduinoJson@^7

[env:matrixportal_s3]
platform = espressif32
board = adafruit_matrixportal_esp32s3
framework = arduino
monitor_speed = 115200
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> -<host_render.cpp>
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit GFX Library
  adafruit/Adafruit Protomatter

; Host build of the renderer for tools/compare.mjs (no Arduino).
[env:native]
platform = native
build_flags = ${env.build_flags} -std=c++17
build_src_filter = +<feed.cpp> +<render.cpp> +<host_render.cpp>
