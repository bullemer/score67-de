map $http_upgrade $score67_connection_upgrade {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=score67_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name score67.de www.score67.de;
    location ^~ /.well-known/acme-challenge/ { root /var/www/score67-acme; }
    location / { return 301 https://score67.de$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.score67.de;
    ssl_certificate /etc/letsencrypt/live/score67.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/score67.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://score67.de$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name score67.de;
    ssl_certificate /etc/letsencrypt/live/score67.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/score67.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 16k;
    access_log /var/log/nginx/score67.access.log;
    error_log /var/log/nginx/score67.error.log;
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/wasm;

    # Overwrite client-supplied forwarding headers. Only this host's Docker
    # gateway is trusted by Uvicorn, and the upstream port binds to loopback.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Team logo uploads (downscaled in the browser) are the only larger requests.
    location ~ ^/api/s/[^/]+/matches/[^/]+/logo$ {
        client_max_body_size 400k;
        limit_req zone=score67_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8067;
    }
    # LED panel firmware uploads by the operator (base64 JSON, a few MB).
    location = /api/firmware {
        client_max_body_size 6m;
        limit_req zone=score67_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8067;
    }
    location /api/ {
        limit_req zone=score67_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8067;
    }
    location /ws/ {
        proxy_pass http://127.0.0.1:8067;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $score67_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location / { proxy_pass http://127.0.0.1:8067; }
}
