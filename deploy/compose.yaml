services:
  app:
    image: score67-app:${RELEASE_SHA:?Set RELEASE_SHA}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://score67:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@db:5432/score67
      COOKIE_SECURE: "true"
      PUBLIC_ORIGIN: https://score67.de
      AUTO_CREATE_SCHEMA: "false"
      RELEASE_SHA: ${RELEASE_SHA}
      # Email sign-in stays hidden until SMTP_HOST is set in the runtime .env.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Score67 <noreply@score67.de>}
      # Every published forum post is mailed here with a hide link (unset = no mails).
      FORUM_MODERATOR_EMAIL: ${FORUM_MODERATOR_EMAIL:-}
      # Operator token for LED panel firmware releases (tools/fw_release.py); unset = uploads disabled.
      FIRMWARE_ADMIN_TOKEN: ${FIRMWARE_ADMIN_TOKEN:-}
    ports:
      - "127.0.0.1:8067:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: score67
      POSTGRES_USER: score67
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U score67 -d score67"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  postgres_data:
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.67.0/24
          gateway: 172.30.67.1
